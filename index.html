<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JNx 工具箱</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#3b82f6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JNx 工具箱">
  <link rel="apple-touch-icon" href="icon-180.png">
  <style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#f5f7fa; --surface:#ffffff; --border:#e2e8f0;
    --text:#1e293b; --text-muted:#64748b; --text-light:#94a3b8;
    --accent:#3b82f6; --accent-soft:#eff6ff;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
    --shadow-lg:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
    --radius:14px;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex;flex-direction:column; line-height:1.6;
  }
  .container{max-width:900px;margin:0 auto;width:100%;padding:40px 24px;flex:1;}

  header{text-align:center;margin-bottom:48px;}
  header h1{
    font-size:2.25rem;font-weight:700;letter-spacing:-.02em;
    display:flex;align-items:center;justify-content:center;gap:12px;
  }
  header h1 .icon{font-size:2rem;}
  header p{color:var(--text-muted);margin-top:8px;font-size:1rem;}

  /* ---- Tool grid ---- */
  .tool-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
  }

  .tool-card{
    background:var(--surface);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:28px 24px;
    text-decoration:none;color:inherit;
    display:flex;flex-direction:column;gap:12px;
    transition:all .25s ease;
    border:1.5px solid transparent;
    position:relative;overflow:hidden;
  }
  .tool-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--card-accent,var(--accent));
    transform:scaleX(0);transform-origin:left;transition:transform .3s ease;
  }
  .tool-card:hover{
    box-shadow:var(--shadow-lg);
    border-color:var(--card-accent,var(--accent));
    transform:translateY(-2px);
  }
  .tool-card:hover::before{transform:scaleX(1);}

  .tool-icon{
    width:48px;height:48px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:1.5rem;
    background:var(--card-accent-soft,var(--accent-soft));
  }
  .tool-title{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;}
  .tool-desc{color:var(--text-muted);font-size:.875rem;line-height:1.5;}
  .tool-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px;}
  .tool-tag{
    font-size:.72rem;padding:2px 10px;border-radius:12px;
    background:var(--bg);color:var(--text-muted);font-weight:500;
  }
  .tool-arrow{
    position:absolute;right:20px;bottom:20px;
    color:var(--card-accent,var(--accent));
    opacity:0;transform:translateX(-4px);transition:all .25s ease;
    font-size:1.2rem;
  }
  .tool-card:hover .tool-arrow{opacity:1;transform:translateX(0);}

  /* ---- Coming soon placeholder ---- */
  .tool-card.disabled{
    opacity:.55;cursor:not-allowed;
  }
  .tool-card.disabled:hover{
    transform:none;border-color:transparent;box-shadow:var(--shadow);
  }
  .tool-card.disabled:hover::before{transform:scaleX(0);}
  .coming-badge{
    font-size:.7rem;padding:2px 10px;border-radius:12px;
    background:var(--bg);color:var(--text-light);font-weight:500;
    display:inline-block;margin-top:4px;
  }

  footer{text-align:center;padding:24px;color:var(--text-light);font-size:.8rem;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  .pwa-install-bar{max-width:900px;margin:0 auto;width:100%;padding:16px 24px 0;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
  .pwa-install-btn{display:none;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;
    border-radius:8px;padding:6px 12px;font-size:.8rem;cursor:pointer;transition:opacity .15s;}
  .pwa-install-btn:hover{opacity:.9;}
  /* 刷新缓存：手机端无法 Ctrl+F5，点此清空 SW 缓存后重载 */
  .btn-refresh{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);
    border-radius:8px;padding:6px 12px;font-size:.8rem;cursor:pointer;transition:all .15s;}
  .btn-refresh:hover{border-color:var(--accent);color:var(--accent);}
  .btn-refresh:disabled{opacity:.5;cursor:not-allowed;}
  .btn-refresh.update-available{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600;}
</style>
</head>
<body>
<div class="pwa-install-bar">
  <button class="pwa-install-btn" id="pwaInstallBtn" type="button">＋ 安装到桌面</button>
  <button class="btn-refresh" id="btnRefreshCache" type="button">🔄 刷新缓存</button>
</div>
<div class="container">
  <header>
    <h1><span class="icon">🛠️</span> JNx 工具箱</h1>
    <p>JNx 系列产品辅助工具集合，数据均在本地处理</p>
  </header>

  <div class="tool-grid" id="toolGrid"></div>
</div>

<footer>JNx 工具箱 · 数据均在本地处理 · 不上传任何数据</footer>

<script>
/*
 * ================================================================
 *  Tool Registry
 *  新增工具只需在此数组中添加一个配置对象即可
 * ================================================================
 */
const TOOLS = [
  {
    id: 'ble-analysis',
    title: 'BLE 分析',
    icon: '🔵',
    desc: '通过 Web Bluetooth API 实时连接 BLE 设备，采集并可视化 ADC 数据',
    href: './ble_analysis.html',
    accent: '#6366f1',
    accentSoft: '#eef2ff',
    tags: ['BLE', '实时采集', 'Web Bluetooth'],
    enabled: true,
  },
  {
    id: 'jna-tools',
    title: 'JNA 工具',
    icon: '🔧',
    desc: '自动连接 JNA 开头的 BLE 设备，并以 1000ms 间隔订阅 FFE1 数据',
    href: './JNA_tools.html',
    accent: '#f59e0b',
    accentSoft: '#fef3c7',
    tags: ['JNA', 'BLE', '自动订阅'],
    enabled: true,
  },
  {
    id: 'jna-plus-tool',
    title: 'JNA Plus 工具',
    icon: '🧪',
    desc: 'JNA-Plus 系列：单通道 26 字节协议（状态/时间/结果/计时/加样/完成/版本号/T1~T6），FFE2 仅保留重启/关机',
    href: './JNA_Plus_Tool.html',
    accent: '#14b8a6',
    accentSoft: '#ccfbf1',
    tags: ['JNA-Plus', 'BLE', 'FFE1 26B'],
    enabled: true,
  },
  {
    id: 'jnb-tool',
    title: 'JNB 工具',
    icon: '🔬',
    desc: 'JNB 系列：单通道 27 字节协议（状态/时间/T1/T2 双结果/计时/加样/完成/版本号/C/T_2/B/T_1 实时/蓝牙确认），FFE2 支持点灯 T1~T4、重启、关机',
    href: './JNB_Tool.html',
    accent: '#ec4899',
    accentSoft: '#fce7f3',
    tags: ['JNB', 'BLE', 'FFE1 27B'],
    enabled: true,
  },
  {
    id: 'jnc-tools',
    title: 'JNC 工具',
    icon: '🛰️',
    desc: '连接 JNC 开头的 BLE 设备，通过 FFE2 命令轮询 12 通道数据（C/B/T）',
    href: './JNC_tools.html',
    accent: '#0ea5e9',
    accentSoft: '#e0f2fe',
    tags: ['JNC', 'BLE', 'FFE2 轮询'],
    enabled: true,
  },
  // ---- 后续新增工具在此添加 ----
  // {
  //   id: 'your-tool',
  //   title: '工具名称',
  //   icon: '🔧',
  //   desc: '工具描述',
  //   href: './your_tool.html',
  //   accent: '#10b981',
  //   accentSoft: '#ecfdf5',
  //   tags: ['标签1', '标签2'],
  //   enabled: true,
  // },
];

/* ================================================================
 *  Render tool cards
 * ================================================================ */
(function(){
  const grid = document.getElementById('toolGrid');
  for(const tool of TOOLS){
    const card = document.createElement('a');
    card.className = 'tool-card' + (tool.enabled ? '' : ' disabled');
    if(tool.enabled){
      card.href = tool.href;
    }
    card.style.setProperty('--card-accent', tool.accent || 'var(--accent)');
    card.style.setProperty('--card-accent-soft', tool.accentSoft || 'var(--accent-soft)');

    const tagsHtml = (tool.tags || [])
      .map(t => `<span class="tool-tag">${t}</span>`)
      .join('');

    card.innerHTML = `
      <div class="tool-icon">${tool.icon || '🔧'}</div>
      <div class="tool-title">${tool.title}</div>
      <div class="tool-desc">${tool.desc || ''}</div>
      <div class="tool-tags">${tagsHtml}</div>
      ${tool.enabled
        ? '<span class="tool-arrow">→</span>'
        : '<span class="coming-badge">敬请期待</span>'}
    `;
    grid.appendChild(card);
  }

  // 注册 Service Worker，启用 PWA 离线/安装能力。
  // 注册后立即显式 update()：保证已安装的 PWA 每次启动都能马上检查并接管新版 SW（尤其 iOS）
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => { if (reg) reg.update().catch(() => {}); })
        .catch((err) => console.error('SW registration failed', err));
    });
  }

  // PWA 手动安装按钮（浏览器未自动弹出安装提示时，点此触发）
  const pwaInstallBtn = document.getElementById('pwaInstallBtn');
  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    if (pwaInstallBtn) pwaInstallBtn.style.display = 'inline-flex';
  });
  if (pwaInstallBtn) {
    pwaInstallBtn.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      try { await deferredInstallPrompt.userChoice; } catch (_) {}
      deferredInstallPrompt = null;
      pwaInstallBtn.style.display = 'none';
    });
  }
  window.addEventListener('appinstalled', () => {
    if (pwaInstallBtn) pwaInstallBtn.style.display = 'none';
  });

  // 刷新缓存：清除 SW 缓存 + 更新 SW 后带参数重载（手机端替代 Ctrl+F5）
  const btnRefreshCache = document.getElementById('btnRefreshCache');
  if (btnRefreshCache) {
    btnRefreshCache.addEventListener('click', async () => {
      const label = btnRefreshCache.textContent;
      btnRefreshCache.textContent = '刷新中...';
      btnRefreshCache.disabled = true;
      try {
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.filter(k => k.startsWith('jnx-tools-')).map(k => caches.delete(k)));
        }
        if (navigator.serviceWorker) {
          const reg = await navigator.serviceWorker.getRegistration();
          if (reg) await reg.update();
        }
      } catch (err) {
        console.error('刷新缓存失败', err);
      }
      const u = new URL(location.href);
      u.searchParams.set('_v', Date.now()); // 破坏缓存参数，强制重新拉取
      location.replace(u.href);
    });
  }

  // 版本检测：仅当检测到服务器内容与本地不一致（需要刷新缓存）时，才显示「刷新缓存」按钮；
  // 平时按钮隐藏，不打扰使用
  let swUpdateShown = false;
  const showRefreshBtn = () => {
    if (swUpdateShown || !btnRefreshCache) return;
    swUpdateShown = true;
    btnRefreshCache.style.display = 'inline-flex';
    btnRefreshCache.classList.add('update-available');
  };
  const swHadController = !!navigator.serviceWorker && !!navigator.serviceWorker.controller;
  if (navigator.serviceWorker) {
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!swHadController) return; // 首次安装接管时不提示
      showRefreshBtn();
    });
    navigator.serviceWorker.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'VERSION_UPDATE' && !location.search.includes('_v=')) {
        showRefreshBtn();
      }
    });
  }
})();
</script>
</body>
</html>
